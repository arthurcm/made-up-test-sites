<!doctype html><html lang="en"><head><meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Stores</title>
<style>body{margin:0;font:16px/1.5 system-ui,-apple-system,sans-serif;color:#1d1d1f;background:#fafaf7}header{display:flex;gap:16px;align-items:center;padding:14px 18px;border-bottom:1px solid #ddd;background:#fff}header a{color:#1d1d1f;text-decoration:none;padding:10px 4px}main{padding:18px}h1{font-size:28px;margin:8px 0 12px}h2{font-size:20px;margin:20px 0 8px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:14px;margin:12px 0}.btn{display:inline-block;padding:12px 18px;border-radius:999px;background:#1d1d1f;color:#fff;text-decoration:none;border:0;font-size:16px}.btn[disabled]{background:#bbb;color:#eee}.nav a{display:block;padding:12px 0;font-size:17px}</style></head><body><header><a href="https://arthurcm.github.io/made-up-test-sites/shop/"><b>TrailKit</b></a><a href="https://arthurcm.github.io/made-up-test-sites/shop/stores">Stores</a><a href="https://arthurcm.github.io/made-up-test-sites/shop/about">About</a></header><main>
<h1>Our stores</h1><p>Tap a store on the map to see its address and opening hours.</p>
<canvas id="map" width="354" height="260" style="width:354px;height:260px;border-radius:12px;background:#e8efe3"></canvas>
<div id="store" class="card">No store chosen yet.</div></main>
<script>var S=[["Leeds",90,170,"Leeds store: 4 Briggate, open 9am to 6pm every day."],["York",230,90,"Leeds store: 4 Briggate, open 9am to 6pm every day."],["Hull",290,200,"Hull store: 18 Whitefriargate, open 10am to 5pm, closed Sundays."]];
var c=document.getElementById("map"),x=c.getContext("2d");x.strokeStyle="#9bb08f";x.lineWidth=6;x.beginPath();x.moveTo(20,240);x.bezierCurveTo(120,150,200,160,340,40);x.stroke();
S.forEach(function(s){x.fillStyle="#c0392b";x.beginPath();x.arc(s[1],s[2],14,0,7);x.fill();x.fillStyle="#1d1d1f";x.font="bold 16px system-ui";x.fillText(s[0],s[1]+18,s[2]+6);});
c.addEventListener("click",function(e){var r=c.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;S.forEach(function(s){if(Math.abs(px-s[1])<40&&Math.abs(py-s[2])<30){document.getElementById("store").textContent="You chose "+s[0]+". "+s[3];history.replaceState(null,"",location.pathname+"#"+s[0].toLowerCase());}});});</script></body></html>
