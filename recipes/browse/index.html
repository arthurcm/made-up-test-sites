<!doctype html><html lang="en"><head><meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>All recipes</title>
<style>body{margin:0;font:16px/1.5 system-ui,-apple-system,sans-serif;color:#1d1d1f;background:#fafaf7}header{display:flex;gap:16px;align-items:center;padding:14px 18px;border-bottom:1px solid #ddd;background:#fff}header a{color:#1d1d1f;text-decoration:none;padding:10px 4px}main{padding:18px}h1{font-size:28px;margin:8px 0 12px}h2{font-size:20px;margin:20px 0 8px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:14px;margin:12px 0}.btn{display:inline-block;padding:12px 18px;border-radius:999px;background:#1d1d1f;color:#fff;text-decoration:none;border:0;font-size:16px}.nav a{display:block;padding:12px 0;font-size:17px}.tab{padding:12px 16px;font-size:16px;border:0;border-bottom:3px solid transparent;background:none}.tab[aria-selected=true]{border-bottom-color:#1d1d1f;font-weight:700}#list .card{padding:10px 14px;margin:8px 0}</style></head><body><header><a href="https://arthurcm.github.io/made-up-test-sites/recipes/"><b>Panful</b></a><a href="https://arthurcm.github.io/made-up-test-sites/recipes/about">About</a></header><main>
<h1>All recipes</h1>
<div role="tablist" aria-label="Kinds of recipe"><button role="tab" class="tab" aria-selected="true">All</button> <button role="tab" class="tab" aria-selected="false">Vegetarian</button> <button role="tab" class="tab" aria-selected="false">Quick</button></div>
<p><b id="count">Showing 6 recipes</b></p>
<div id="list"><div class="card" data-k="veg">Lentil soup</div><div class="card" data-k="meat">Chicken pie</div><div class="card" data-k="veg quick">Tomato pasta</div><div class="card" data-k="meat quick">Fish tacos</div><div class="card" data-k="veg">Green curry</div><div class="card" data-k="meat">Beef stew</div></div>
</main>
<script>document.querySelectorAll(".tab").forEach(function(t){t.addEventListener("click",function(){document.querySelectorAll(".tab").forEach(function(x){x.setAttribute("aria-selected",String(x===t));});var k={All:"",Vegetarian:"veg",Quick:"quick"}[t.textContent],n=0;document.querySelectorAll("#list .card").forEach(function(c){var on=!k||c.dataset.k.split(" ").indexOf(k)>=0;c.style.display=on?"":"none";if(on)n++;});if(k!=="veg")document.getElementById("count").textContent="Showing "+n+" recipes";});});</script></body></html>
