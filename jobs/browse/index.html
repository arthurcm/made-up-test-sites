<!doctype html><html lang="en"><head><meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Browse by place</title>
<style>body{margin:0;font:16px/1.5 system-ui,-apple-system,sans-serif;color:#1d1d1f;background:#fafaf7}header{display:flex;gap:16px;align-items:center;padding:14px 18px;border-bottom:1px solid #ddd;background:#fff}header a{color:#1d1d1f;text-decoration:none;padding:10px 4px}main{padding:18px}h1{font-size:28px;margin:8px 0 12px}h2{font-size:20px;margin:20px 0 8px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:14px;margin:12px 0}.btn{display:inline-block;padding:12px 18px;border-radius:999px;background:#1d1d1f;color:#fff;text-decoration:none;border:0;font-size:16px}.nav a{display:block;padding:12px 0;font-size:17px}.chip{padding:12px 16px;font-size:16px;border-radius:999px;border:1px solid #999;background:#fff}.chip[aria-pressed=true]{background:#1d1d1f;color:#fff}</style></head><body><header><a href="https://arthurcm.github.io/made-up-test-sites/jobs/"><b>JobNest</b></a><a href="https://arthurcm.github.io/made-up-test-sites/jobs/jobs">Jobs</a><a href="https://arthurcm.github.io/made-up-test-sites/jobs/about">About</a></header><main>
<h1>Browse by place</h1>
<div class="chips"><button type="button" class="chip" aria-pressed="true">All</button> <button type="button" class="chip" aria-pressed="false">Remote</button> <button type="button" class="chip" aria-pressed="false">On-site</button></div>
<div id="list"><div class="card" data-w="remote"><b>Product Designer</b><br>Remote, full time</div><div class="card" data-w="remote"><b>Content Writer</b><br>Remote, part time</div><div class="card" data-w="site"><b>Office Manager</b><br>On-site in Berlin</div><div class="card" data-w="site"><b>Barista Trainer</b><br>On-site in Leeds</div></div>
</main>
<script>document.querySelectorAll(".chip").forEach(function(c){c.addEventListener("click",function(){document.querySelectorAll(".chip").forEach(function(x){x.setAttribute("aria-pressed",String(x===c));});var show={All:["remote","remote","site","site"],Remote:["remote",null,"site","site"],"On-site":[null,null,"site","site"]}[c.textContent];document.querySelectorAll("#list .card").forEach(function(j,i){j.style.display=show[i]?"":"none";});});});</script></body></html>
