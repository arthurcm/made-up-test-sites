<!doctype html><html lang="en"><head><meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Menu</title>
<style>body{margin:0;font:16px/1.5 system-ui,-apple-system,sans-serif;color:#1d1d1f;background:#fafaf7}header{display:flex;gap:16px;align-items:center;padding:14px 18px;border-bottom:1px solid #ddd;background:#fff}header a{color:#1d1d1f;text-decoration:none;padding:10px 4px}main{padding:18px}h1{font-size:28px;margin:8px 0 12px}h2{font-size:20px;margin:20px 0 8px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:14px;margin:12px 0}.btn{display:inline-block;padding:12px 18px;border-radius:999px;background:#1d1d1f;color:#fff;text-decoration:none;border:0;font-size:16px}.nav a{display:block;padding:12px 0;font-size:17px}.tab{padding:12px 16px;font-size:16px;border:0;border-bottom:3px solid transparent;background:none}.tab[aria-selected=true]{border-bottom-color:#1d1d1f;font-weight:700}.filters{margin:10px 0}</style></head><body><header><a href="https://arthurcm.github.io/made-up-test-sites/cafe/"><b>Corner Café</b></a><a href="https://arthurcm.github.io/made-up-test-sites/cafe/menu">Menu</a><a href="https://arthurcm.github.io/made-up-test-sites/cafe/visit">Visit</a></header><main><h1>Menu</h1>
<div role="tablist" aria-label="Kinds of item"><button role="tab" class="tab" aria-selected="true">All</button> <button role="tab" class="tab" aria-selected="false">Drinks</button> <button role="tab" class="tab" aria-selected="false">Food</button></div>
<div class="filters"><button type="button" class="btn" id="sort">Sort by price, highest first</button></div>
<p><b id="count">Showing 3 items</b></p>
<div id="list"><div class="card" data-k="drink" data-p="320">Flat white: £3.20</div><div class="card" data-k="food" data-p="380">Carrot cake: £3.80</div><div class="card" data-k="food" data-p="550">Cheese toastie: £5.50</div></div><p>Prices as of 20 November 2026.</p></main>
<script>var L=document.getElementById("list");document.querySelectorAll(".tab").forEach(function(t){t.addEventListener("click",function(){document.querySelectorAll(".tab").forEach(function(x){x.setAttribute("aria-selected",String(x===t));});var k={All:"",Drinks:"drink",Food:"food"}[t.textContent],n=0;L.querySelectorAll(".card").forEach(function(c){var on=!k||c.dataset.k===k;c.style.display=on?"":"none";if(on)n++;});document.getElementById("count").textContent="Showing "+n+(n===1?" item":" items");});});
document.getElementById("sort").addEventListener("click",function(){[].slice.call(L.children).sort(function(a,b){return b.dataset.p-a.dataset.p;}).forEach(function(c){L.appendChild(c);});});</script></body></html>
