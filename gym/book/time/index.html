<!doctype html><html lang="en"><head><meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Book a class</title>
<style>body{margin:0;font:16px/1.5 system-ui,-apple-system,sans-serif;color:#1d1d1f;background:#fafaf7}header{display:flex;gap:16px;align-items:center;padding:14px 18px;border-bottom:1px solid #ddd;background:#fff}header a{color:#1d1d1f;text-decoration:none;padding:10px 4px}main{padding:18px}h1{font-size:28px;margin:8px 0 12px}h2{font-size:20px;margin:20px 0 8px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:14px;margin:12px 0}.btn{display:inline-block;padding:12px 18px;border-radius:999px;background:#1d1d1f;color:#fff;text-decoration:none;border:0;font-size:16px}.btn[disabled]{background:#bbb;color:#eee}.nav a{display:block;padding:12px 0;font-size:17px}.opt{cursor:pointer;background:#fff;border:1px solid #ccc;border-radius:12px;padding:14px;margin:8px 0}.opt.on{border:2px solid #1d1d1f;font-weight:700}</style></head><body><header style="justify-content:space-between"><a href="https://arthurcm.github.io/made-up-test-sites/gym/"><b>Pulse Gym</b></a><button id="menu" aria-label="Menu" aria-expanded="false" style="font-size:24px;background:none;border:0;padding:8px 12px">☰</button></header><nav id="drawer" style="display:none;padding:0 18px;background:#fff;border-bottom:1px solid #ddd"></nav><main>
<h1 id="h">Book a class</h1><p id="p">Step 1 of 2: choose a class.</p>
<div id="opts"><div class="opt">Yoga</div><div class="opt">Spin</div><div class="opt">HIIT</div></div>
<p><button class="btn" id="go" disabled>Next</button></p></main>
<script>var chosen="",step=1,go=document.getElementById("go");
function pick(list,f){document.querySelectorAll(".opt").forEach(function(o){o.addEventListener("click",function(){document.querySelectorAll(".opt").forEach(function(x){x.classList.toggle("on",x===o);});f(o.textContent);});});}
pick(null,function(t){chosen=t;go.disabled=false;});
go.addEventListener("click",function(){if(step!==1)return;step=2;history.pushState(null,"","https://arthurcm.github.io/made-up-test-sites/gym/book/time/");document.getElementById("h").textContent="Choose a time for "+chosen;document.getElementById("p").textContent="Step 2 of 2: choose a time this week.";
document.getElementById("opts").innerHTML=["Tuesday 7am","Wednesday 6pm","Saturday 10am"].map(function(t){return '<div class="opt">'+t+'</div>';}).join("");go.textContent="Continue";go.disabled=true;
pick(null,function(){/* the time is shown as chosen, and Continue stays greyed out */});});</script><script>document.getElementById("menu").addEventListener("click",function(){var d=document.getElementById("drawer"),open=d.style.display==="none";
d.innerHTML=open?[["Classes","/classes"],["Timetable","/timetable"],["Prices","/prices"],["Book a class","/book"]].map(function(l){return '<a style="display:block;padding:12px 0;font-size:17px;color:#1d1d1f" href="https://arthurcm.github.io/made-up-test-sites/gym'+l[1]+'">'+l[0]+'</a>';}).join(""):"";
d.style.display=open?"":"none";this.setAttribute("aria-expanded",String(open));});</script></body></html>
